name: Auto Scrape M3U Playlist - Chuoi Chien TV

on:
  schedule:
    - cron: '0 */2 * * *' # Tự động chạy 2 tiếng một lần
  workflow_dispatch: # Cho phép bấm chạy thủ công

# Cấp quyền ghi trực tiếp cho workflow để tránh lỗi Exit Code 128
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          # Chỉ commit nếu có sự thay đổi, tránh báo lỗi khi file giữ nguyên
          git diff --staged --quiet || git commit -m "Auto update playlist.m3u"
          git push origin main
          
