name: Auto Scrape M3U Playlist - Chuoi Chien TV

on:
  schedule:
    # Tự động chạy mỗi 2 tiếng (00:00, 02:00, 04:00,... theo giờ UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Vẫn giữ nút bấm chạy thủ công khi cần

permissions:
  contents: write

env:
  TZ: "Asia/Ho_Chi_Minh" # Ép múi giờ Việt Nam để ngày tháng hiển thị chính xác

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper playwright
          playwright install chromium --with-deps

      - name: Run scraper script
        run: |
          python scraper.py

      - name: Commit and push playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist [skip ci]" && git push)
          
